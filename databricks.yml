bundle:
  name: edetl-workshop

include:
  - resources/*.yml

# Single target: stg.
# In dev, attendees create their own SDP pipeline directly from the workspace
# SDP editor (pointing at this repo cloned into a Databricks Git folder) — no
# DAB involved. The DAB owns stg only, demonstrating the workspace -> DAB
# promotion pattern. See README for the dev setup walk-through.
variables:
  catalog:
    description: "UC catalog (REQUIRED — set via --var catalog=... or repo secret)"
  schema:
    description: "Schema for pipeline outputs"
    default: edetl_stg
  volume:
    description: "Volume name for raw landing files"
    default: raw_landing
  raw_path:
    description: "Computed UC volume path the pipeline reads from"
    default: /Volumes/${var.catalog}/${var.schema}/${var.volume}

targets:
  stg:
    default: true
    # Development mode is the right choice for a workshop:
    #   - portable across workspaces (no host pin required)
    #   - allows user-folder root_path (avoids needing a shared SP location)
    #   - prefixes resource names with `[dev <user>]` so attendees don't collide
    #   - any schedules are auto-paused on deploy
    # For production CI/CD, switch to `mode: production`, pin a `host:` under
    # workspace, and configure `run_as` for a service principal.
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
