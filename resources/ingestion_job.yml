resources:
  jobs:
    ingestion_job:
      name: "[${bundle.target}] edetl-ingestion"

      tasks:
        - task_key: run_ingestion_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ingestion_pipeline.id}
            full_refresh: false

      # No schedule — attendees trigger the job manually during the workshop.
      # To run on a cadence, add a `schedule:` block with quartz_cron_expression,
      # timezone_id, and pause_status. See:
      # https://learn.microsoft.com/en-us/azure/databricks/jobs/scheduled

      max_concurrent_runs: 1

      permissions:
        - level: CAN_VIEW
          group_name: users
